        // --- NEW THREE.JS BIM PLAYGROUND LOGIC ---
        function initBIMPlayground() {
            const container = document.getElementById('bim-canvas-container');
            if (!container) return;

            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a202c); 

            const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(15, 12, 20);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.05; 

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // Ground/Siteplan Base
            const groundGeometry = new THREE.PlaneGeometry(40, 30);
            const groundMaterial = new THREE.MeshLambertMaterial({ color: 0x2d3748 }); 
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Jalan
            const roadMat = new THREE.MeshLambertMaterial({ color: 0x111827 });
            const road1 = new THREE.Mesh(new THREE.PlaneGeometry(40, 5), roadMat);
            road1.rotation.x = -Math.PI / 2;
            road1.position.y = 0.01;
            scene.add(road1);

            const houses = [];
            const houseGroup = new THREE.Group();
            scene.add(houseGroup);

            // Fungsi pembuat objek rumah 3D
            const buildHouse = (x, z, id, status, type) => {
                const isApproved = status === 'Siap KPR';
                const wallColor = isApproved ? 0xe2e8f0 : 0xfdcb6e; 
                const roofColor = isApproved ? 0x00b4d8 : 0xff7675;

                const houseObj = new THREE.Group();

                const wallGeo = new THREE.BoxGeometry(2.5, 2, 3.5);
                const wallMat = new THREE.MeshLambertMaterial({ color: wallColor });
                const wall = new THREE.Mesh(wallGeo, wallMat);
                wall.position.y = 1;
                wall.castShadow = true;
                wall.receiveShadow = true;
                houseObj.add(wall);

                const roofGeo = new THREE.ConeGeometry(2.2, 1.5, 4);
                const roofMat = new THREE.MeshLambertMaterial({ color: roofColor });
                const roof = new THREE.Mesh(roofGeo, roofMat);
                roof.position.y = 2.75;
                roof.rotation.y = Math.PI / 4;
                roof.castShadow = true;
                houseObj.add(roof);

                houseObj.position.set(x, 0, z);
                
                // Menyematkan Data Simulasi ke Model 3D
                wall.userData = {
                    id: id,
                    type: type,
                    status: status,
                    harga: 'Rp 185.000.000',
                    luasLahan: '84 m²',
                    luasBangun: '30 m²',
                    kamarTidur: 2,
                    kamarMandi: 1,
                    atap: 'GALVALUM',
                    dinding: 'BATA MERAH',
                    lantaiPondasi: 'KERAMIK 40x40 & BATU KALI',
                    izin: isApproved ? 'Sesuai RDTR (Zona Aman)' : 'Tertunda (Cek Zona Pemda)'
                };
                
                houses.push(wall);
                houseGroup.add(houseObj);
            };

            // Setup deretan rumah
            for(let i=0; i<4; i++) {
                buildHouse(-12 + (i*8), -5, `Blok A-${i+1}`, 'Siap KPR', 'Tipe 30/84');
                
                // Sengaja membuat 1 unit bermasalah agar pengguna bisa melihat perbedaannya
                let stat = i === 2 ? 'Pending Review' : 'Siap KPR'; 
                buildHouse(-12 + (i*8), 5, `Blok B-${i+1}`, stat, 'Tipe 30/84');
            }

            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            const dataPanel = document.getElementById('bim-data-panel');

            // Interaksi Klik
            function onMouseClick(event) {
                const rect = container.getBoundingClientRect();
                mouse.x = ((event.clientX - rect.left) / container.clientWidth) * 2 - 1;
                mouse.y = -((event.clientY - rect.top) / container.clientHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(houses);

                if (intersects.length > 0) {
                    const data = intersects[0].object.userData;
                    const statusColor = data.status === 'Siap KPR' ? 'text-success' : 'text-warning';
                    const statusIcon = data.status === 'Siap KPR' ? '✅' : '⏳';
                    
                    dataPanel.innerHTML = `
                        <div class="text-left animate-fade-in flex flex-col h-full justify-between">
                            <div>
                                <div class="flex justify-between items-start border-b border-gray-600 pb-2 mb-3">
                                    <div>
                                        <span class="font-bold text-xl text-white">Unit ${data.id}</span>
                                        <div class="text-accent font-bold text-base mt-1">${data.harga}</div>
                                    </div>
                                    <span class="bg-gray-700 px-2 py-1 rounded text-xs font-semibold text-white">${data.type}</span>
                                </div>
                                
                                <div class="grid grid-cols-2 gap-2 text-xs mb-3">
                                    <div class="bg-gray-700 bg-opacity-50 p-2 rounded border border-gray-600">
                                        <div class="text-gray-400 mb-1">Luas (Lahan/Bangun)</div>
                                        <div class="font-semibold text-white">${data.luasLahan} / ${data.luasBangun}</div>
                                    </div>
                                    <div class="bg-gray-700 bg-opacity-50 p-2 rounded border border-gray-600">
                                        <div class="text-gray-400 mb-1">Kamar (Tidur/Mandi)</div>
                                        <div class="font-semibold text-white">${data.kamarTidur} KT / ${data.kamarMandi} KM</div>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <div class="text-xs text-gray-400 mb-1 border-b border-gray-600 pb-1">Ekstraksi Material (BIM):</div>
                                    <ul class="text-[11px] text-white space-y-1.5 mt-2">
                                        <li class="flex justify-between"><span class="text-gray-400">Atap:</span> <span class="font-semibold text-right">${data.atap}</span></li>
                                        <li class="flex justify-between"><span class="text-gray-400">Dinding:</span> <span class="font-semibold text-right">${data.dinding}</span></li>
                                        <li class="flex justify-between"><span class="text-gray-400">Lantai & Pondasi:</span> <span class="font-semibold text-right">${data.lantaiPondasi}</span></li>
                                    </ul>
                                </div>
                                
                                <div class="mb-2 bg-gray-900 p-2 rounded">
                                     <div class="text-[11px] text-gray-400 mb-1">Sinkronisasi Tata Ruang (RDTR Pemda):</div>
                                     <div class="text-xs font-semibold ${data.status === 'Siap KPR' ? 'text-success' : 'text-warning'} flex items-center gap-1">
                                        ${data.status === 'Siap KPR' ? '📍' : '⚠️'} ${data.izin}
                                     </div>
                                </div>
                            </div>

                            <div class="mt-2 bg-gray-700 p-2.5 rounded-lg text-center shadow-inner border border-gray-600">
                                <div class="text-[10px] text-gray-300 uppercase tracking-wide mb-1">Validasi Tapera & Bank</div>
                                <div class="font-bold text-sm ${statusColor}">${statusIcon} ${data.status}</div>
                            </div>
                        </div>
                    `;
                }
            }

            container.addEventListener('click', onMouseClick);

            // Responsif Resize
            window.addEventListener('resize', () => {
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            });

            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }
            animate();
        }
